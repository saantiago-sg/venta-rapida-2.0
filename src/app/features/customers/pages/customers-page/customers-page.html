<h1 class="text-xl font-semibold tracking-tight mb-4">Clientes</h1>

<div class="flex flex-col gap-4">
  <div class="flex justify-end">
    <p-button label="Nuevo cliente" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <div class="surface-card bg-card border border-border rounded-xl overflow-hidden">
  <p-table [value]="store.customers()" [loading]="store.loading()" dataKey="id">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Email</th>
        <th class="w-24 text-center">Activo</th>
        <th class="w-16"></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-customer>
      <tr>
        <td>
          <div class="flex items-center gap-2">
            <span class="flex items-center justify-center w-7 h-7 rounded-full bg-brand/10 text-brand text-xs font-semibold uppercase shrink-0">
              {{ customer.name.charAt(0) }}
            </span>
            {{ customer.name }}
          </div>
        </td>
        <td>{{ customer.phone || '-' }}</td>
        <td>{{ customer.email || '-' }}</td>
        <td class="text-center">
          <p-toggleswitch [ngModel]="customer.active" (ngModelChange)="onToggleActive(customer.id, $event)" />
        </td>
        <td>
          <button
            type="button"
            class="pi pi-pencil cursor-pointer text-text-secondary hover:text-text"
            (click)="openEdit(customer)"
          ></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5">
          <div class="flex flex-col items-center gap-2 py-10 text-center">
            <i class="pi pi-users text-2xl text-text-secondary"></i>
            <p class="text-sm text-text-secondary">Todavía no hay clientes cargados.</p>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
  </div>
</div>

<p-dialog
  [(visible)]="dialogVisible"
  [modal]="true"
  [style]="{ width: '28rem' }"
  [header]="editingCustomer() ? 'Editar cliente' : 'Nuevo cliente'"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <div class="flex flex-col gap-1">
      <label class="text-sm text-text-secondary">Nombre</label>
      <input type="text" pInputText formControlName="name" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm text-text-secondary">Teléfono</label>
      <input type="text" pInputText formControlName="phone" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm text-text-secondary">Email</label>
      <input type="email" pInputText formControlName="email" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm text-text-secondary">Documento</label>
      <input type="text" pInputText formControlName="document" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm text-text-secondary">Dirección</label>
      <input type="text" pInputText formControlName="address" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm text-text-secondary">Notas</label>
      <input type="text" pInputText formControlName="notes" />
    </div>

    <p-button type="submit" label="Guardar" [loading]="saving()" styleClass="w-full" />
  </form>
</p-dialog>
