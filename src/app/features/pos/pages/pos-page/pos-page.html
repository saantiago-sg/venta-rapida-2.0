<div class="h-full flex flex-col">
  <h1 class="text-xl font-semibold tracking-tight mb-5">Vender</h1>

  <div class="flex-1 grid grid-cols-1 lg:grid-cols-[1.5fr_1fr_18rem] gap-5 min-h-0">
    <div class="surface-card bg-card border border-border rounded-xl p-5 min-h-0">
      <app-product-search />
    </div>

    <div class="surface-card bg-card border border-border rounded-xl p-5 min-h-0">
      <app-cart />
    </div>

    <div class="surface-card bg-card border border-border rounded-xl p-6 overflow-auto">
      <app-payment-panel (saleConfirmed)="onSaleConfirmed($event)" />
    </div>
  </div>
</div>

<p-dialog [(visible)]="confirmationVisible" [modal]="true" [style]="{ width: '24rem' }" header="Venta confirmada">
  @if (lastSale(); as sale) {
    <div class="flex flex-col gap-2">
      <p class="text-2xl font-semibold tracking-tight text-brand">Venta #{{ sale.saleNumber }}</p>
      <div class="flex justify-between text-sm">
        <span class="text-text-secondary">Total</span>
        <span class="tabular-nums">{{ sale.total | number: '1.2-2' }}</span>
      </div>
      @if (sale.changeGiven !== null) {
        <div class="flex justify-between text-sm">
          <span class="text-text-secondary">Vuelto</span>
          <span class="tabular-nums">{{ sale.changeGiven | number: '1.2-2' }}</span>
        </div>
      }
      @if (posStore.invoiceNotice(); as notice) {
        <div class="flex items-start gap-2 rounded-lg bg-warning/10 text-warning text-xs px-3 py-2 mt-1">
          <i class="pi pi-exclamation-triangle mt-0.5"></i>
          <span>{{ notice }}</span>
        </div>
      }
      <div class="flex gap-2 mt-2">
        <p-button label="Reimprimir" icon="pi pi-print" [outlined]="true" styleClass="flex-1" (onClick)="onPrint()" />
        <p-button label="Cerrar" styleClass="flex-1" (onClick)="confirmationVisible.set(false)" />
      </div>
    </div>
  }
</p-dialog>

<app-ticket-print [data]="lastSale()" />
