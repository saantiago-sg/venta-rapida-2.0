<h1 class="text-xl font-semibold tracking-tight mb-6">Configuración</h1>

<div class="grid grid-cols-1 lg:grid-cols-[240px_1fr] gap-6 items-start">
  <nav class="surface-card bg-card border border-border rounded-xl p-2 flex lg:flex-col gap-1 overflow-x-auto">
    @for (section of sections; track section.id) {
      <button
        type="button"
        (click)="activeSection.set(section.id)"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-left whitespace-nowrap transition-colors shrink-0"
        [class]="
          activeSection() === section.id
            ? 'bg-brand/10 text-brand font-medium'
            : 'text-text-secondary hover:bg-card-hover hover:text-text'
        "
      >
        <i [class]="section.icon"></i>
        {{ section.label }}
      </button>
    }
  </nav>

  <div class="surface-card bg-card border border-border rounded-xl p-6 lg:p-8 min-w-0">
    @switch (activeSection()) {
      @case ('negocio') {
        <app-business-form animate.enter="enter-fade" />
      }
      @case ('impuestos') {
        <app-tax-list animate.enter="enter-fade" />
      }
      @case ('medios-pago') {
        <app-payment-method-list animate.enter="enter-fade" />
      }
      @case ('entrega') {
        <app-delivery-type-list animate.enter="enter-fade" />
      }
      @case ('empleados') {
        <app-employee-list animate.enter="enter-fade" />
      }
    }
  </div>
</div>
