<div class="flex flex-col gap-4 max-w-xl">
  <div class="flex items-center gap-2">
    <input
      type="text"
      pInputText
      placeholder="Nombre (ej. Transferencia)"
      [ngModel]="newName()"
      (ngModelChange)="newName.set($event)"
      class="flex-1"
    />
    <label class="flex items-center gap-2 text-sm text-text-secondary whitespace-nowrap">
      <p-toggleswitch [ngModel]="newIsCash()" (ngModelChange)="newIsCash.set($event)" />
      Es efectivo
    </label>
    <p-button label="Agregar" [loading]="saving()" (onClick)="onCreate()" />
  </div>

  <p-table [value]="store.paymentMethods()" [loading]="store.loading()" dataKey="id">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th class="w-32 text-center">Es efectivo</th>
        <th class="w-32 text-center">Activo</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-method>
      <tr>
        <td>{{ method.name }}</td>
        <td class="text-center">
          <i class="pi" [class.pi-check]="method.isCash" [class.pi-minus]="!method.isCash"></i>
        </td>
        <td class="text-center">
          <p-toggleswitch [ngModel]="method.active" (ngModelChange)="onToggleActive(method.id, $event)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center text-text-secondary">Todavía no hay medios de pago cargados.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
