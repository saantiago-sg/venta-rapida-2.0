<div class="flex flex-col gap-4">
  <div class="flex flex-col sm:flex-row sm:items-center gap-2">
    <input
      type="text"
      pInputText
      placeholder="Nombre (ej. Transferencia)"
      [ngModel]="newName()"
      (ngModelChange)="newName.set($event)"
      class="flex-1"
    />
    <label class="flex items-center gap-2 text-sm text-text-secondary whitespace-nowrap">
      <p-toggleswitch [ngModel]="newIsCash()" (ngModelChange)="newIsCash.set($event)" />
      Es efectivo
    </label>
    <p-button label="Agregar" [loading]="saving()" (onClick)="onCreate()" />
  </div>

  @if (errorMessage()) {
    <p class="text-sm text-error">{{ errorMessage() }}</p>
  }

  <div class="border border-border rounded-lg overflow-hidden">
  <div class="overflow-x-auto">
  <p-table [value]="store.paymentMethods()" [loading]="store.loading()" dataKey="id" [rowTrackBy]="trackById">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th class="w-32 text-center">Es efectivo</th>
        <th class="w-32 text-center">Facturar</th>
        <th class="w-32 text-center">Activo</th>
        <th class="w-16"></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-method>
      <tr>
        <td>
          <div class="flex items-center gap-2">
            <span
              class="flex items-center justify-center w-7 h-7 rounded-full shrink-0"
              [class]="method.isCash ? 'bg-success/10 text-success' : 'bg-info/10 text-info'"
            >
              <i class="pi text-xs" [class.pi-wallet]="method.isCash" [class.pi-credit-card]="!method.isCash"></i>
            </span>
            {{ method.name }}
          </div>
        </td>
        <td class="text-center">
          @if (method.isCash) {
            <p-tag value="Sí" severity="success" />
          } @else {
            <p-tag value="No" severity="secondary" />
          }
        </td>
        <td class="text-center">
          <p-toggleswitch [ngModel]="method.invoicingEnabled" (ngModelChange)="onToggleInvoicing(method.id, $event)" />
        </td>
        <td class="text-center">
          <p-toggleswitch [ngModel]="method.active" (ngModelChange)="onToggleActive(method.id, $event)" />
        </td>
        <td class="text-center">
          <button
            type="button"
            class="pi pi-trash cursor-pointer text-text-secondary hover:text-error"
            [class.opacity-50]="deletingId() === method.id"
            [disabled]="deletingId() === method.id"
            (click)="onDeleteClick(method)"
          ></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5">
          <div class="flex flex-col items-center gap-2 py-10 text-center">
            <i class="pi pi-wallet text-2xl text-text-secondary"></i>
            <p class="text-sm text-text-secondary">Todavía no hay medios de pago cargados.</p>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
  </div>
  </div>
</div>

<p-confirmdialog />
