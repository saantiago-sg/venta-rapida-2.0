<div class="flex flex-col gap-4">
  <div class="flex gap-2">
    <input
      type="text"
      pInputText
      placeholder="Nombre (ej. Envío)"
      [ngModel]="newName()"
      (ngModelChange)="newName.set($event)"
      (keyup.enter)="onCreate()"
      class="flex-1"
    />
    <p-button label="Agregar" [loading]="saving()" (onClick)="onCreate()" />
  </div>

  <div class="border border-border rounded-lg overflow-hidden">
  <p-table [value]="store.deliveryTypes()" [loading]="store.loading()" dataKey="id">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th class="w-32 text-center">Activo</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-type>
      <tr>
        <td>
          <div class="flex items-center gap-2">
            <span class="flex items-center justify-center w-7 h-7 rounded-full bg-brand/10 text-brand shrink-0">
              <i class="pi pi-truck text-xs"></i>
            </span>
            {{ type.name }}
          </div>
        </td>
        <td class="text-center">
          <p-toggleswitch [ngModel]="type.active" (ngModelChange)="onToggleActive(type.id, $event)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="2">
          <div class="flex flex-col items-center gap-2 py-10 text-center">
            <i class="pi pi-truck text-2xl text-text-secondary"></i>
            <p class="text-sm text-text-secondary">Todavía no hay tipos de entrega cargados.</p>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
  </div>
</div>
