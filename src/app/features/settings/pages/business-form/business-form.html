<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 max-w-xl">
  <div class="flex flex-col gap-1">
    <label class="text-sm text-text-secondary">Nombre del negocio</label>
    <input type="text" pInputText formControlName="name" />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm text-text-secondary">Razón social (opcional)</label>
    <input type="text" pInputText formControlName="legalName" />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm text-text-secondary">CUIT / documento fiscal (opcional)</label>
    <input type="text" pInputText formControlName="taxId" />
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div class="flex flex-col gap-1">
      <label class="text-sm text-text-secondary">Email</label>
      <input type="email" pInputText formControlName="email" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-sm text-text-secondary">Teléfono</label>
      <input type="text" pInputText formControlName="phone" />
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm text-text-secondary">Dirección</label>
    <input type="text" pInputText formControlName="address" />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm text-text-secondary">Descuento por pago en efectivo (%)</label>
    <p-inputnumber formControlName="cashDiscountPercentage" suffix="%" [min]="0" [max]="100" styleClass="w-40" />
  </div>

  <p-button type="submit" label="Guardar cambios" styleClass="w-full" />
</form>
