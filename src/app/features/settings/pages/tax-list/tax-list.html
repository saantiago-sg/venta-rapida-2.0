<div class="flex flex-col gap-4">
  <div class="flex flex-col sm:flex-row gap-2">
    <input
      type="text"
      pInputText
      placeholder="Nombre (ej. IVA 21%)"
      [ngModel]="newName()"
      (ngModelChange)="newName.set($event)"
      class="flex-1"
    />
    <p-inputnumber
      [ngModel]="newRate()"
      (ngModelChange)="newRate.set($event)"
      locale="es-AR"
      suffix="%"
      [min]="0"
      [max]="100"
      [style]="{ width: '7rem' }"
      inputStyleClass="w-full"
      styleClass="shrink-0"
    />
    <p-button label="Agregar" [loading]="saving()" (onClick)="onCreate()" />
  </div>

  <div class="border border-border rounded-lg overflow-hidden">
  <div class="overflow-x-auto">
  <p-table [value]="store.taxes()" [loading]="store.loading()" dataKey="id">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th class="text-right">Tasa</th>
        <th class="w-32 text-center">Activo</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-tax>
      <tr>
        <td>
          <div class="flex items-center gap-2">
            <span class="flex items-center justify-center w-7 h-7 rounded-full bg-brand/10 text-brand shrink-0">
              <i class="pi pi-percentage text-xs"></i>
            </span>
            {{ tax.name }}
          </div>
        </td>
        <td class="text-right tabular-nums">{{ tax.rate }}%</td>
        <td class="text-center">
          <p-toggleswitch [ngModel]="tax.active" (ngModelChange)="onToggleActive(tax.id, $event)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3">
          <div class="flex flex-col items-center gap-2 py-10 text-center">
            <i class="pi pi-percentage text-2xl text-text-secondary"></i>
            <p class="text-sm text-text-secondary">Todavía no hay impuestos cargados.</p>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
  </div>
  </div>
</div>
