<div class="flex flex-col gap-4">
  <div class="flex justify-between items-center gap-3">
    <span class="relative w-full max-w-md">
      <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary text-sm"></i>
      <input
        #searchInput
        type="text"
        pInputText
        placeholder="Buscar categoría..."
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event)"
        class="w-full pl-9 pr-9"
        autofocus
      />
      @if (searchQuery()) {
        <button
          type="button"
          (click)="onClearSearch()"
          aria-label="Limpiar búsqueda"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-text-secondary hover:text-text"
        >
          <i class="pi pi-times text-sm"></i>
        </button>
      }
    </span>
    <p-button
      label="Nueva categoría"
      icon="pi pi-plus"
      [disabled]="!canManageProducts()"
      (onClick)="openCreate()"
      pTooltip="No tenés permiso para gestionar productos"
      tooltipPosition="bottom"
      [tooltipDisabled]="canManageProducts()"
    />
  </div>

  <div class="surface-card bg-card border border-border rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
    <p-table [value]="filteredCategories()" [loading]="store.loading()" dataKey="id">
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre</th>
          <th class="w-32 text-center">Activa</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-category>
        <tr>
          <td>
            <div class="flex items-center gap-2">
              <span class="flex items-center justify-center w-7 h-7 rounded-full bg-brand/10 text-brand shrink-0">
                <i class="pi pi-folder text-xs"></i>
              </span>
              {{ category.name }}
            </div>
          </td>
          <td class="text-center">
            <p-toggleswitch
              [ngModel]="category.active"
              [disabled]="!canManageProducts()"
              (ngModelChange)="onToggleActive(category.id, $event)"
            />
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="2">
            @if (searchQuery().trim()) {
              <div class="flex flex-col items-center gap-2 py-10 text-center">
                <i class="pi pi-search text-2xl text-text-secondary"></i>
                <p class="text-sm text-text-secondary">No se encontraron categorías con "{{ searchQuery() }}".</p>
              </div>
            } @else {
              <div class="flex flex-col items-center gap-2 py-10 text-center">
                <i class="pi pi-folder text-2xl text-text-secondary"></i>
                <p class="text-sm text-text-secondary">Todavía no hay categorías.</p>
              </div>
            }
          </td>
        </tr>
      </ng-template>
    </p-table>
    </div>
  </div>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="onDialogVisibleChange($event)"
  [modal]="true"
  appendTo="body"
  [style]="{ width: '24rem', maxWidth: '92vw' }"
  header="Nueva categoría"
>
  <form (ngSubmit)="onCreate()" class="flex flex-col gap-4">
    <div class="flex flex-col gap-1">
      <label class="text-sm text-text-secondary">Nombre</label>
      <input
        type="text"
        pInputText
        placeholder="Ej. Bebidas"
        [ngModel]="newCategoryName()"
        (ngModelChange)="newCategoryName.set($event)"
        name="categoryName"
        class="w-full"
        autofocus
      />
    </div>
    <p-button type="submit" label="Agregar" [loading]="saving()" styleClass="w-full" />
  </form>
</p-dialog>
