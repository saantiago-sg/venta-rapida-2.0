<div class="flex h-screen bg-bg text-text">
  <aside class="w-60 shrink-0 bg-bg-sidebar border-r border-border flex flex-col">
    <div class="h-16 flex flex-col justify-center px-4">
      <span class="text-lg font-semibold text-brand leading-tight">VentaRapida</span>
      <span class="text-xs font-semibold text-info tracking-wide">SUPER ADMIN</span>
    </div>

    <nav class="flex-1 px-2 space-y-1">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-card text-text"
          class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-text-secondary hover:bg-card-hover hover:text-text transition-colors"
        >
          <i [class]="item.icon"></i>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="border-t border-border p-3 flex flex-col gap-2">
      @if (authStore.userEmail()) {
        <span class="px-1 text-xs text-text-secondary truncate">{{ authStore.userEmail() }}</span>
      }
      <button
        type="button"
        (click)="onLogout()"
        class="flex items-center gap-2 px-3 py-2 rounded-md text-sm text-text-secondary hover:bg-card-hover hover:text-text transition-colors"
      >
        <i class="pi pi-sign-out"></i>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 shrink-0 border-b border-border flex items-center px-6">
      <span class="text-sm text-text-secondary">Panel Super Admin</span>
    </header>

    <main class="flex-1 overflow-auto p-6">
      <router-outlet />
    </main>
  </div>
</div>
