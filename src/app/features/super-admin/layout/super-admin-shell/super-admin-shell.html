<div class="flex h-screen bg-bg text-text">
  @if (sidebarOpen()) {
    <div class="fixed inset-0 bg-black/40 z-30 lg:hidden" (click)="toggleSidebar()"></div>
  }

  <aside
    class="fixed lg:static inset-y-0 left-0 z-40 w-60 transition-transform duration-300 lg:translate-x-0"
    [class]="sidebarOpen() ? 'translate-x-0' : '-translate-x-full'"
  >
    <div class="h-full bg-sidebar border-r border-sidebar-border flex flex-col">
      <a routerLink="/super-admin" class="h-16 flex flex-col justify-center gap-1 px-4" aria-label="Ir al inicio">
        <img src="images/logovr-transparent.png" alt="VentaRapida" class="h-9 w-auto self-start" />
        <span class="text-xs font-semibold text-info tracking-wide">SUPER ADMIN</span>
      </a>

      <nav class="flex-1 px-2 space-y-1">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-sidebar-active text-sidebar-text before:h-5"
            class="relative flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-sidebar-text-secondary hover:bg-sidebar-active hover:text-sidebar-text transition-colors before:absolute before:left-0 before:top-1/2 before:-translate-y-1/2 before:h-0 before:w-1 before:rounded-full before:bg-brand before:transition-all before:duration-300"
          >
            <i [class]="item.icon"></i>
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="border-t border-sidebar-border p-3 flex flex-col gap-2">
        @if (authStore.userEmail()) {
          <span class="px-1 text-xs text-sidebar-text-secondary truncate">{{ authStore.userEmail() }}</span>
        }
        <button
          type="button"
          (click)="onLogout()"
          class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-sidebar-text-secondary hover:bg-sidebar-active hover:text-sidebar-text transition-colors"
        >
          <i class="pi pi-sign-out"></i>
          Cerrar sesión
        </button>
      </div>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 shrink-0 border-b border-border flex items-center gap-3 px-6">
      <button
        type="button"
        (click)="toggleSidebar()"
        class="flex items-center justify-center w-8 h-8 rounded-lg bg-brand text-white hover:bg-brand-hover transition-colors shadow-sm lg:hidden"
        [attr.aria-label]="sidebarOpen() ? 'Ocultar menú' : 'Mostrar menú'"
      >
        <i class="pi pi-bars text-sm"></i>
      </button>
      <span class="text-sm text-text-secondary">Panel Super Admin</span>
    </header>

    <main class="flex-1 overflow-auto p-6">
      <router-outlet />
    </main>
  </div>
</div>
