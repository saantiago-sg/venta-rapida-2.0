<h1 class="text-xl font-semibold tracking-tight mb-4">Negocios</h1>

<div class="flex flex-col gap-4">
  <div class="flex justify-end">
    <p-button label="Nuevo negocio" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <div class="surface-card bg-card border border-border rounded-xl overflow-hidden">
  <div class="overflow-x-auto">
  <p-table [value]="store.businesses()" [loading]="store.loading()" dataKey="id">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th class="w-48">Suscripción</th>
        <th class="w-32 text-center">Activo</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-business>
      <tr>
        <td>
          <div class="flex items-center gap-2">
            <span class="flex items-center justify-center w-7 h-7 rounded-full bg-brand/10 text-brand shrink-0">
              <i class="pi pi-building text-xs"></i>
            </span>
            {{ business.name }}
          </div>
        </td>
        <td>
          <p-select
            [ngModel]="business.subscriptionStatus"
            (ngModelChange)="onStatusChange(business.id, $event)"
            [options]="statusOptions"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            styleClass="w-full"
          />
        </td>
        <td class="text-center">
          <p-toggleswitch [ngModel]="business.active" (ngModelChange)="onToggleActive(business.id, $event)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3">
          <div class="flex flex-col items-center gap-2 py-10 text-center">
            <i class="pi pi-building text-2xl text-text-secondary"></i>
            <p class="text-sm text-text-secondary">Todavía no hay negocios.</p>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
  </div>
  </div>
</div>

<p-dialog [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '28rem', maxWidth: '92vw' }" header="Crear negocio nuevo">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <div class="flex flex-col gap-1">
      <label class="text-sm text-text-secondary">Nombre del negocio</label>
      <input type="text" pInputText formControlName="businessName" placeholder="Mercado La Loma" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm text-text-secondary">Nombre del dueño (opcional)</label>
      <input type="text" pInputText formControlName="ownerFullName" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm text-text-secondary">Email del dueño</label>
      <input type="email" pInputText formControlName="ownerEmail" autocomplete="off" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm text-text-secondary">Contraseña temporal</label>
      <input type="text" pInputText formControlName="ownerPassword" autocomplete="off" />
    </div>

    @if (errorMessage()) {
      <p class="text-sm text-error">{{ errorMessage() }}</p>
    }

    <p-button type="submit" label="Crear negocio" [loading]="saving()" styleClass="w-full" />
  </form>
</p-dialog>
