<div class="flex h-screen bg-bg text-text">
  <aside class="w-60 shrink-0 bg-bg-sidebar border-r border-border flex flex-col">
    <div class="h-16 flex items-center px-4 text-lg font-semibold text-brand">
      VentaRapida
    </div>
    <nav class="flex-1 px-2 space-y-1">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-card text-text"
          class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-text-secondary hover:bg-card-hover hover:text-text transition-colors"
        >
          <i [class]="item.icon"></i>
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 shrink-0 border-b border-border flex items-center justify-between px-6">
      @if (authStore.memberships().length > 1) {
        <select
          class="bg-card border border-border rounded-md px-3 py-1.5 text-sm text-text"
          [value]="authStore.activeBusinessId()"
          (change)="onBusinessChange($event)"
        >
          @for (membership of authStore.memberships(); track membership.businessId) {
            <option [value]="membership.businessId">{{ membership.businessName }}</option>
          }
        </select>
      } @else {
        <span class="text-sm text-text-secondary">
          {{ authStore.activeMembership()?.businessName }}
        </span>
      }

      <span class="text-sm text-text-secondary">
        {{ authStore.activeMembership()?.role }}
      </span>
    </header>

    <main class="flex-1 overflow-auto p-6">
      <router-outlet />
    </main>
  </div>
</div>
