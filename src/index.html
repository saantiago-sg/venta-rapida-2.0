<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>VentaRapida</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="images/logovrnav.png">
  <!-- Estilos del splash inline a proposito: tienen que estar antes de que cargue el CSS de la app. -->
  <style>
    .app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #fdfbf8;
    }
    .app-splash img {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(249, 115, 22, 0.25);
    }
    .app-splash-ring {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(249, 115, 22, 0.2);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: app-splash-spin 0.8s linear infinite;
    }
    @keyframes app-splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- El contenido de <app-root> se ve mientras baja el bundle y corren los app initializers
       (restoreSession); Angular lo reemplaza solo al terminar de arrancar. -->
  <app-root>
    <div class="app-splash" role="status" aria-label="Cargando">
      <img src="images/logovrnav.png" alt="VentaRapida">
      <div class="app-splash-ring"></div>
    </div>
  </app-root>
</body>
</html>
